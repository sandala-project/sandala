name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - zensical.toml
      - README.md
      - AGENTS.md
  pull_request:
    paths-ignore:
      - docs/**
      - zensical.toml
      - README.md
      - AGENTS.md
  workflow_dispatch:
  workflow_call:
    inputs:
      export_images:
        description: Save the tested Docker images as downloadable artifacts
        type: boolean
        default: false
    outputs:
      version:
        description: Release version validated against the Python and admin UI manifests
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check Python, admin UI, and tag versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            version="$(python scripts/check_version.py --tag "$RELEASE_TAG")"
          else
            version="$(python scripts/check_version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,s3]'
      - run: python -m pytest -m 'not integration' -ra --junitxml=test-results/unit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-tests-python-${{ matrix.python }}
          path: test-results/unit.xml
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: MongoDB and S3 integration tests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,s3]'
      - name: Check integration prerequisites
        run: |
          docker info
          python -c 'import boto3, testcontainers.mongodb, testcontainers.core.wait_strategies'
      - run: python -m pytest -m integration -ra --junitxml=test-results/integration.xml
      - name: Reject silently skipped integration tests
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          report = ElementTree.parse('test-results/integration.xml')
          skipped = report.findall('.//testcase/skipped')
          if skipped:
              raise SystemExit(f'Integration run skipped {len(skipped)} tests')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-tests
          path: test-results/integration.xml
          if-no-files-found: ignore
          retention-days: 7

  distribution:
    name: Build and verify Python distributions
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_distribution.py
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python scripts/verify_distribution.py
      - name: Record distribution checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image (linux/${{ matrix.arch }})
    needs: [version, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: sandala:${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}
          push: false
          load: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Check the installed package and bundled admin UI
        run: |
          docker run --rm -i --network none --platform "linux/$ARCH" \
            --env "EXPECTED_VERSION=$VERSION" --entrypoint python "$IMAGE" - <<'PY'
          import os
          from importlib.metadata import version
          from flask import Flask
          from sandala.api.routes_admin import register_admin_ui_routes
          assert os.getuid() != 0
          assert version('sandala') == os.environ['EXPECTED_VERSION']
          assert version('boto3')
          assert version('gunicorn')
          app = Flask(__name__)
          register_admin_ui_routes(app)
          client = app.test_client()
          assert client.get('/admin/').status_code == 200
          assert client.get('/admin/_app/nodes/tree').status_code == 200
          assert client.get('/admin/config.js').status_code == 200
          manifest = client.get('/admin/static/manifest.json').get_json()
          assert isinstance(manifest, dict) and manifest
          for entry in manifest.values():
              for asset in [entry['file'], *entry.get('css', []), *entry.get('assets', [])]:
                  assert client.get('/admin/' + asset).status_code == 200, asset
          PY
      - name: Export the tested image
        if: inputs.export_images
        run: docker save "$IMAGE" | gzip > "$RUNNER_TEMP/sandala-$VERSION-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.export_images
        with:
          name: docker-image-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/sandala-${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
