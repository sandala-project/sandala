name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_run_id:
        description: 'Docker-only publication: successful tag Release build run ID (run from main); empty means checks only'
        type: string
        default: ''
      update_latest:
        description: 'Docker-only publication: also move the latest image tag to this release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  documentation:
    if: github.event_name != 'workflow_dispatch' || inputs.image_run_id == ''
    # The reusable workflow declares a Pages deployment job, but release
    # calls only build the documentation (deploy defaults to false).
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: false
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.image_run_id == ''
    uses: ./.github/workflows/ci.yml
    with:
      export_images: true

  prepare-image-publication:
    name: Validate Docker publication source
    needs: [build, documentation]
    if: >-
      !cancelled() && github.repository == 'sandala-project/sandala' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
        needs.build.result == 'success' && needs.documentation.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.image_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      amd64_artifact: ${{ steps.source.outputs.amd64_artifact }}
      arm64_artifact: ${{ steps.source.outputs.arm64_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Validate release run, tag, commit, and image artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.image_run_id || github.run_id }}
        shell: bash
        run: |
          args=(--run-id "$SOURCE_RUN_ID")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--current-run-id "$GITHUB_RUN_ID")
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run Docker-only publication from main'
            exit 1
          fi
          python scripts/prepare_image_publication.py "${args[@]}" >> "$GITHUB_OUTPUT"

  publish-ghcr:
    name: Publish multi-platform Docker image to GHCR
    needs: prepare-image-publication
    if: ${{ !cancelled() && needs.prepare-image-publication.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-ghcr-sandala
      cancel-in-progress: false
    environment:
      name: ghcr
      url: https://github.com/orgs/sandala-project/packages/container/package/sandala
    permissions:
      actions: read
      packages: write
    env:
      IMAGE: ghcr.io/sandala-project/sandala
      VERSION: ${{ needs.prepare-image-publication.outputs.version }}
      REVISION: ${{ needs.prepare-image-publication.outputs.revision }}
      UPDATE_LATEST: ${{ github.event_name == 'push' || inputs.update_latest }}
    defaults:
      run:
        shell: bash
    steps:
      # No checkout, rebuild, or execution of image contents in this job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare-image-publication.outputs.amd64_artifact }},${{ needs.prepare-image-publication.outputs.arm64_artifact }}
          path: images/
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare-image-publication.outputs.run_id }}
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested images and assemble the release manifest
        run: |
          for arch in amd64 arm64; do
            docker load --input "images/sandala-$VERSION-linux-$arch.tar.gz"
            platform="$(docker image inspect "sandala:$VERSION" --format '{{.Os}}/{{.Architecture}}')"
            if [[ "$platform" != "linux/$arch" ]]; then
              echo "::error::Unexpected image platform: $platform"
              exit 1
            fi
            target="$IMAGE:$VERSION-$arch"
            docker tag "sandala:$VERSION" "$target"
            docker push "$target"
            oras manifest fetch --descriptor "$target" | \
              jq --arg arch "$arch" '.platform = {os: "linux", architecture: $arch}' > "$arch.json"
          done
          # Build an OCI index explicitly: Buildx drops index annotations when
          # every source manifest uses the Docker media type.
          jq --null-input --slurpfile amd64 amd64.json --slurpfile arm64 arm64.json \
            --arg version "$VERSION" --arg revision "$REVISION" '{
              schemaVersion: 2,
              mediaType: "application/vnd.oci.image.index.v1+json",
              manifests: [$amd64[0], $arm64[0]],
              annotations: {
                "org.opencontainers.image.source": "https://github.com/sandala-project/sandala",
                "org.opencontainers.image.description": "Headless CMS for structured data, built on MongoDB with an admin UI",
                "org.opencontainers.image.licenses": "MIT",
                "org.opencontainers.image.version": $version,
                "org.opencontainers.image.revision": $revision
              }
            }' > image-index.json
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "$IMAGE:$VERSION" image-index.json
          oras manifest fetch "$IMAGE:$VERSION" | \
            jq --exit-status --slurpfile expected image-index.json '. == $expected[0]'
          if [[ "$UPDATE_LATEST" == true ]]; then
            digest="$(oras resolve "$IMAGE:$VERSION")"
            oras tag "$IMAGE@$digest" latest
          fi

  publish-pypi:
    name: Publish Python distributions to PyPI
    needs: [build, documentation]
    if: >-
      github.repository == 'sandala-project/sandala' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sandala/
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Publish the exact distributions verified by CI; do not rebuild or
      # execute project code in the job that can obtain a PyPI token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Verify checksums and select package files
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          mkdir ../packages
          cp -- *.whl *.tar.gz ../packages/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/
